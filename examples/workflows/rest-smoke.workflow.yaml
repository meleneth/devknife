name: rest-smoke
seed_events:
  - id: seed-load-account
    type: account.load.requested
    payload:
      account_id: acct_001
      correlation_id: rest-smoke-001
handlers:
  - on: account.load.requested
    effects:
      - type: rest
        service: rest
        operation: get_account
        method: GET
        path: /accounts/{{ event.payload.account_id }}
        headers:
          x-correlation-id: "{{ event.payload.correlation_id }}"
        expect:
          status: 200
        emits:
          - event_type: account.loaded
            payload:
              account_id: body.id
              name: body.name
              correlation_id: body.correlation_id
  - on: account.loaded
    effects:
      - type: record
        message: account loaded from REST fixture
