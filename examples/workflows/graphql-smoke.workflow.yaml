version: devknife.workflow/v1alpha1
name: graphql-smoke
seed_events:
  - id: seed-load-account-users
    type: account.users.load.requested
    payload:
      account_id: acct_001
handlers:
  - on: account.users.load.requested
    effects:
      - type: graphql
        service: graphql
        operation_name: AccountUsers
        query: |
          query AccountUsers($id: ID!) {
            account(id: $id) {
              id
              name
              users { id email }
            }
          }
        variables:
          id: "{{ event.payload.account_id }}"
        expect:
          status: 200
        emits:
          - event_type: account.users.loaded
            payload:
              account_id:
                from: $.data.account.id
              name:
                from: $.data.account.name
              users:
                from: $.data.account.users
  - on: account.users.loaded
    effects:
      - type: record
        message: account users loaded from GraphQL fixture
