# Illustrative draft only. REST, GraphQL, SNS, and SQS have narrow executable
# adapters now, but this multi-protocol WebSocket scenario is still not executable.
name: future-rest-graphql-sqs-websocket
seed_events:
  - id: seed-demo
    type: workflow.started
    payload:
      account_id: acct_001
      correlation_id: run_demo_001
handlers:
  - on: workflow.started
    effects:
      - type: rest
        operation: get_account
        method: GET
        url: "{{ env.rest_base_url }}/accounts/{{ event.payload.account_id }}"
        headers:
          x-correlation-id: "{{ event.payload.correlation_id }}"
        emits:
          event_type: account.loaded
  - on: account.loaded
    effects:
      - type: graphql
        operation_name: AccountUsers
        query: |
          query AccountUsers($id: ID!) {
            account(id: $id) {
              id
              name
              users { id email }
            }
          }
        variables:
          id: "{{ event.payload.id }}"
        emits:
          event_type: account.users.loaded
      - type: websocket_expect
        session: demo
        send:
          type: subscribe
          channel: demo
          correlation_id: "{{ run.id }}"
        expect:
          type: subscription.confirmed
          correlation_id: "{{ run.id }}"
        emits:
          event_type: websocket.subscription.confirmed
      - type: sqs_poll
        queue: devknife-workflow-results
        correlation_id: "{{ run.id }}"
        timeout_ms: 5000
        delete_on_success: true
        emits:
          event_type: workflow.result.received
